<div class="layout">
  <app-toolbar class="header" label="Application header">
    <div class="app-container header-row">
      <div class="brand">
        <span class="mark" aria-hidden="true">YT</span>
        <span class="name">YTSkedy</span>
      </div>
      @if (isAuthenticated()) {
        <app-user-badge
          [initials]="userBadge.initials"
          [fullName]="userBadge.fullName"
          (signOut)="signOut()"
        />
      }
    </div>
  </app-toolbar>

  @if (isAuthenticated()) {
    <app-toolbar-nav class="nav" label="Primary navigation" [items]="navItems" />
  }

  <main class="main">
    <div class="app-container">
      <router-outlet />
    </div>
  </main>
</div>
