<app-input [field]="siteUrl()" label="Site URL" placeholder="https://example.com/" />
<app-input [field]="username()" label="Username" />
<app-masked-input
  [field]="applicationPassword()"
  label="Application Password"
  [displayValue]="passwordDisplayValue()"
  maskMode="password"
/>
<app-select [field]="postStatus()" label="Post status" [options]="postStatusOptions" />
@if (showScheduleOffset()) {
  <app-input
    [field]="scheduleOffsetHours()"
    label="Hours before event start"
    inputType="number"
    [min]="1"
    [max]="168"
    [step]="1"
  />
}
<app-checkbox [field]="sticky()" label="Make this post sticky" />
<app-wordpress-category-selector [platformId]="platformId()" [categoryIds]="categoryIds()" />
