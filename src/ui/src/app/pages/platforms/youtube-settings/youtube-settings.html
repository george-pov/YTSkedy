<app-input [field]="clientId()" label="Client ID" />
<app-input
  [field]="clientSecret()"
  label="Client secret"
  type="password"
  [placeholder]="clientSecretDisplayValue()"
  [floatLabel]="clientSecretDisplayValue() ? 'always' : 'auto'"
  [hidePlaceholderOnFocus]="true"
/>
<app-input
  [field]="refreshToken()"
  label="Refresh token"
  type="password"
  [placeholder]="refreshTokenDisplayValue()"
  [floatLabel]="refreshTokenDisplayValue() ? 'always' : 'auto'"
  [hidePlaceholderOnFocus]="true"
/>
<app-select
  [field]="privacyStatus()"
  label="Privacy status"
  [options]="privacyOptions"
/>
<app-select
  [field]="madeForKids()"
  label="Made for kids"
  [options]="madeForKidsOptions"
/>
