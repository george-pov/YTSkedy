<app-input [field]="clientId()" label="Client ID" />
<app-masked-input
  [field]="clientSecret()"
  label="Client secret"
  [displayValue]="clientSecretDisplayValue()"
  maskMode="secret"
/>
<app-masked-input
  [field]="refreshToken()"
  label="Refresh token"
  [displayValue]="refreshTokenDisplayValue()"
  maskMode="secret"
/>
<app-select [field]="privacyStatus()" label="Privacy status" [options]="privacyOptions" />
<app-select [field]="madeForKids()" label="Made for kids" [options]="madeForKidsOptions" />
<app-select [field]="categoryId()" label="Category" [options]="categoryOptions()" />
<app-select
  [field]="containsSyntheticMedia()"
  label="Altered or synthetic content"
  [options]="syntheticMediaOptions"
/>
