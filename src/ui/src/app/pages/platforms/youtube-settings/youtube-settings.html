<app-input [field]="clientId()" label="Client ID" />
@if (clientSecretDisplayValue()) {
  <p class="secret-status">
    <span>Current client secret</span>
    <strong>{{ clientSecretDisplayValue() }}</strong>
  </p>
}
<app-input
  [field]="clientSecret()"
  label="Client secret"
  type="password"
  [placeholder]="clientSecretConfigured() ? 'Leave blank to keep existing secret' : ''"
/>
@if (refreshTokenDisplayValue()) {
  <p class="secret-status">
    <span>Current refresh token</span>
    <strong>{{ refreshTokenDisplayValue() }}</strong>
  </p>
}
<app-input
  [field]="refreshToken()"
  label="Refresh token"
  type="password"
  [placeholder]="refreshTokenConfigured() ? 'Leave blank to keep existing token' : ''"
/>
<app-select
  [field]="privacyStatus()"
  label="Privacy status"
  [options]="privacyOptions"
/>
<app-select
  [field]="madeForKids()"
  label="Made for kids"
  [options]="madeForKidsOptions"
/>
