<section class="templates">
  <header class="header">
    <h1>Templates</h1>
    <app-button (click)="newTemplate()">New Template</app-button>
  </header>

  <div class="app-grid app-gap-6">
    <app-data-table
      class="app-col-md-5"
      [data]="templates()"
      [columns]="columns"
      [selectable]="true"
      [selectedRow]="selectedTemplate()"
      [showPaginator]="false"
      caption="Templates"
      emptyText="No templates yet."
      (rowClick)="select($event.id)"
    />

    @if (selectedId() !== null) {
      <form class="app-col-md-7 editor" (submit)="onSubmit($event)">
        <app-input [field]="form.type" label="Type" />
        <app-input [field]="form.name" label="Name" />
        <app-input multiline [field]="form.content" label="Content" [rows]="8" />

        <div class="app-actions">
          <app-button type="submit">Save</app-button>
          <app-button appearance="outlined" (click)="deleteSelected()">
            Delete
          </app-button>
        </div>
      </form>
    }
  </div>
</section>
