<section class="layout">
  <header class="header">
    <h1>Calendar Events</h1>
    <app-button class="add-new-button" (click)="addNewEvent()">
      Add new event
    </app-button>
  </header>

  @if (isLoading() && events().length === 0) {
    <p class="status" role="status">Loading calendar events...</p>
  } @else {
    @if (errorMessage(); as message) {
      <p class="status has-error" role="alert">{{ message }}</p>
    }
    <app-data-table
      [data]="events()"
      [columns]="columns"
      caption="Calendar events"
      mode="server"
      [emptyText]="errorMessage() ? '' : 'No calendar events found.'"
      [totalCount]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [sortActive]="sortActive()"
      [sortDirection]="sortDirection()"
      (stateChange)="onTableStateChange($event)"
    >
      <ng-template appDataTableCell="actions" let-event>
        @if (canPublish(event)) {
          <app-button
            class="publish-button"
            appearance="outlined"
            [disabled]="publishingId() === event.calendarEventId"
            (click)="publish(event)"
          >
            Publish
          </app-button>
        }
      </ng-template>
    </app-data-table>
  }
</section>
