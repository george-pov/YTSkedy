<section class="layout">
  <header class="header">
    <h1>Calendar Events</h1>
    <app-button icon="add" class="add-new-button" (click)="addNewEvent()">
      Add new event
    </app-button>
  </header>

  @if (showLoading()) {
    <app-progress-bar label="Loading calendar events" />
  } @else {
    @if (errorMessage(); as message) {
      <app-alert variant="error">{{ message }}</app-alert>
    }
    <app-data-table
      [data]="events()"
      [columns]="columns"
      caption="Calendar events"
      mode="server"
      [emptyText]="errorMessage() ? '' : 'No calendar events found.'"
      [totalCount]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [sortActive]="sortActive()"
      [sortDirection]="sortDirection()"
      [highlightRowsOnHover]="true"
      [clickableRows]="true"
      (stateChange)="onTableStateChange($event)"
      (rowClick)="editEvent($event)"
    >
      <ng-template appDataTableCell="title" let-event>
        <a
          class="event-title-link"
          [routerLink]="['/calendar-events', event.calendarEventId, 'edit']"
          (click)="$event.stopPropagation()"
        >
          {{ event.displayTitle }}
        </a>
      </ng-template>
    </app-data-table>
  }
</section>
