<section class="layout">
  <header class="header">
    <h1>Calendar Events</h1>
    <app-button icon="add" class="add-new-button" (click)="addNewEvent()">
      Add new event
    </app-button>
  </header>

  @if (showLoading()) {
    <app-progress-bar label="Loading calendar events" />
  } @else {
    @if (errorMessage(); as message) {
      <app-alert variant="error">{{ message }}</app-alert>
    }
    <app-data-table
      [data]="events()"
      [columns]="columns"
      caption="Calendar events"
      mode="server"
      [emptyText]="errorMessage() ? '' : 'No calendar events found.'"
      [totalCount]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [sortActive]="sortActive()"
      [sortDirection]="sortDirection()"
      (stateChange)="onTableStateChange($event)"
    >
      <ng-template appDataTableCell="actions" let-event>
        <div class="app-actions">
          <app-button
            class="edit-button"
            iconButton
            icon="edit"
            ariaLabel="Edit"
            (click)="editEvent(event)"
          />
        </div>
      </ng-template>
    </app-data-table>
  }
</section>
