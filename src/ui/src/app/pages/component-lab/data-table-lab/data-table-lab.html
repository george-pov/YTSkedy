<app-lab-page titleId="data-table-lab-title" title="Data Table">
  <app-lab-example
    titleId="data-table-basic-example-title"
    title="Sortable and paginated"
  >
    <app-data-table
      [data]="rows"
      [columns]="columns"
      caption="Demo recordings"
      [pageSize]="10"
      emptyText="No recordings to show."
    >
      <ng-template appDataTableCell="actions" let-row>
        <app-button appearance="outlined">Edit {{ row.name }}</app-button>
      </ng-template>
    </app-data-table>
  </app-lab-example>

  <app-lab-example
    titleId="data-table-server-example-title"
    title="Server-side sorting and pagination"
  >
    <app-data-table
      [data]="serverPageData()"
      [columns]="serverColumns"
      caption="Demo recordings (server-side)"
      mode="server"
      [totalCount]="serverTotalCount()"
      [pageIndex]="serverPageIndex()"
      [pageSize]="serverPageSize()"
      [sortActive]="serverSortActive()"
      [sortDirection]="serverSortDirection()"
      emptyText="No recordings to show."
      (stateChange)="onServerStateChange($event)"
    ></app-data-table>
  </app-lab-example>
</app-lab-page>
