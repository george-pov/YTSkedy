<app-lab-page titleId="button-lab-title" title="Button">
  <app-lab-example titleId="button-outlined-example-title" title="Outlined" itemsLayout="inline">
    <app-button appearance="outlined">Save</app-button>
    <app-button appearance="outlined">Cancel</app-button>
  </app-lab-example>
  <app-lab-example titleId="button-filled-example-title" title="Filled" itemsLayout="inline">
    <app-button appearance="filled">Save</app-button>
    <app-button appearance="filled">Cancel</app-button>
  </app-lab-example>
  <app-lab-example titleId="button-disabled-example-title" title="Disabled" itemsLayout="inline">
    <app-button [disabled]="true">Schedule stream</app-button>
    <app-button [disabled]="true" appearance="outlined">Cancel</app-button>
    <app-button [disabled]="true">Disabled</app-button>
  </app-lab-example>
</app-lab-page>
