<app-lab-page titleId="alert-lab-title" title="Alert">
  <app-lab-example titleId="alert-success-example-title" title="Success">
    <app-alert variant="success">Calendar event published.</app-alert>
  </app-lab-example>

  <app-lab-example titleId="alert-error-example-title" title="Error">
    <app-alert variant="error">Calendar events could not be loaded.</app-alert>
  </app-lab-example>

  <app-lab-example titleId="alert-info-example-title" title="Info">
    <app-alert variant="info"> Publishing creates a scheduled YouTube broadcast. </app-alert>
  </app-lab-example>

  <app-lab-example titleId="alert-warning-example-title" title="Warning">
    <app-alert variant="warning">
      This event is scheduled in the past and cannot be published.
    </app-alert>
  </app-lab-example>

  <app-lab-example titleId="alert-dismissible-example-title" title="Dismissible">
    @if (dismissed()) {
      <app-button variant="outlined" (click)="reset()"> Reset example </app-button>
    } @else {
      <app-alert variant="info" dismissible (dismissed)="onDismiss()">
        Dismiss this banner to hide it.
      </app-alert>
    }
  </app-lab-example>

  <app-lab-example
    titleId="alert-snackbar-example-title"
    title="Success snackbar"
    itemsLayout="inline"
  >
    <app-button (click)="showSuccessToast()">Show success toast</app-button>
  </app-lab-example>
</app-lab-page>
