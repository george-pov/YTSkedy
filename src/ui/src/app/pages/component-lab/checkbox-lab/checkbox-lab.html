<app-lab-page titleId="checkbox-lab-title" title="Checkbox">
  <app-lab-example titleId="checkbox-unchecked-example-title" title="Unchecked">
    <app-checkbox [field]="form.unchecked" label="Unchecked" />
  </app-lab-example>

  <app-lab-example titleId="checkbox-checked-example-title" title="Checked">
    <app-checkbox [field]="form.checked" label="Checked" />
  </app-lab-example>

  <app-lab-example titleId="checkbox-disabled-example-title" title="Disabled">
    <app-checkbox [field]="form.disabled" label="Disabled" />
  </app-lab-example>
</app-lab-page>
