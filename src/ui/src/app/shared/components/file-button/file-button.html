<input
  #fileInput
  class="file-input"
  type="file"
  [accept]="accept()"
  [disabled]="disabled()"
  (change)="onFileChange($event)"
/>

<app-button
  type="button"
  [variant]="appearance()"
  [icon]="icon()"
  [disabled]="disabled()"
  (click)="openPicker(fileInput)"
>
  {{ label() }}
</app-button>
