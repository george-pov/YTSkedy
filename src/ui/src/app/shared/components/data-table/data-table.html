<div class="table-wrap">
  <table
    mat-table
    matSort
    [dataSource]="dataSource"
    [matSortActive]="sortActive()"
    [matSortDirection]="sortDirection()"
    [matSortDisableClear]="mode() === 'server'"
    (matSortChange)="onSortChange()"
  >
    @if (caption()) {
      <caption class="visually-hidden">{{ caption() }}</caption>
    }

    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          [disabled]="!column.sortable"
          [class.align-end]="column.align === 'end'"
        >
          {{ column.header }}
        </th>
        <td
          mat-cell
          *matCellDef="let row; let i = index"
          [class]="cellClasses(column)"
          [attr.title]="column.truncate ? cellText(column, row) : null"
        >
          @if (cellTemplate(column.key); as template) {
            <ng-container
              *ngTemplateOutlet="
                template;
                context: { $implicit: row, row: row, index: i }
              "
            ></ng-container>
          } @else {
            {{ cellText(column, row) }}
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()"
      [class.selectable]="selectable()"
      [class.selected]="isSelected(row)"
      [attr.role]="selectable() ? 'button' : null"
      [attr.tabindex]="selectable() ? 0 : null"
      [attr.aria-pressed]="selectable() ? isSelected(row) : null"
      (click)="onRowClick(row)"
      (keydown.enter)="onRowClick(row)"
      (keydown.space)="onRowClick(row); $event.preventDefault()"
    ></tr>

    @if (emptyText()) {
      <tr class="empty-row" *matNoDataRow>
        <td [attr.colspan]="displayedColumns().length">{{ emptyText() }}</td>
      </tr>
    }
  </table>
</div>

@if (showPaginator()) {
  <mat-paginator
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    [length]="paginatorLength()"
    [pageIndex]="pageIndex()"
    (page)="onPageChange()"
  ></mat-paginator>
}
