name: Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment containing the Azure deployment variables.
        required: true
        default: dev
        type: environment

permissions:
  contents: read

concurrency:
  group: deploy-azure-function-${{ github.ref }}-${{ github.event.inputs.github_environment || 'dev' }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: src/api/YTSkedy.slnx
  TEST_RESULTS_PATH: build/test-results/backend
  COVERAGE_REPORT_PATH: build/coverage/backend
  FUNCTION_APP_PROJECT_PATH: src/api/YTSkedy.AzureFunctions/YTSkedy.AzureFunctions.csproj
  PUBLISH_OUTPUT_PATH: build/publish/YTSkedy.AzureFunctions
  DEPLOY_PACKAGE_PATH: build/deploy/YTSkedy.AzureFunctions
  DEPLOY_ARTIFACT_NAME: ytskedy-azure-functions

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run backend tests
        env:
          YTSKEDY_RUN_AZURITE_TESTS: 1
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ${{ env.TEST_RESULTS_PATH }}

      - name: Generate backend coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: ${{ env.TEST_RESULTS_PATH }}/**/coverage.cobertura.xml
          targetdir: ${{ env.COVERAGE_REPORT_PATH }}
          reporttypes: MarkdownSummaryGithub;Html
          assemblyfilters: +YTSkedy.*;-*.Test;-*.TestSupport

      - name: Publish backend coverage summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="${COVERAGE_REPORT_PATH}/SummaryGithub.md"

          if [ ! -f "$summary" ]; then
            printf '## Backend code coverage\n\nCoverage report was not generated.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ytskedy-backend-coverage
          path: ${{ env.COVERAGE_REPORT_PATH }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Azure Functions project
        run: dotnet publish ${{ env.FUNCTION_APP_PROJECT_PATH }} --configuration Release --no-restore --output ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEPLOY_ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_OUTPUT_PATH }}
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.github_environment || 'dev' }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEPLOY_ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PACKAGE_PATH }}

      - name: Verify deployment variables
        shell: bash
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_FUNCTIONAPP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in this GitHub Environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.DEPLOY_PACKAGE_PATH }}
