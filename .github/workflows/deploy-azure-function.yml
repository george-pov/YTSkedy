name: Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment containing the Azure deployment variables.
        required: true
        default: production
        type: environment

permissions:
  contents: read

concurrency:
  group: deploy-azure-function-${{ github.ref }}-${{ github.event.inputs.github_environment || 'production' }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: src/YTSkedy.slnx
  UNIT_TEST_PROJECT_PATH: src/Test/YTSkedy.Scheduling.Application.Test/YTSkedy.Scheduling.Application.Test.csproj
  FUNCTION_APP_PROJECT_PATH: src/YTSkedy.AzureFunctions/YTSkedy.AzureFunctions.csproj
  PUBLISH_OUTPUT_PATH: build/publish/YTSkedy.AzureFunctions
  DEPLOY_PACKAGE_PATH: build/deploy/YTSkedy.AzureFunctions
  DEPLOY_ARTIFACT_NAME: ytskedy-azure-functions

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ${{ env.UNIT_TEST_PROJECT_PATH }} --configuration Release --no-build

      - name: Publish Azure Functions project
        run: dotnet publish ${{ env.FUNCTION_APP_PROJECT_PATH }} --configuration Release --no-restore --output ${{ env.PUBLISH_OUTPUT_PATH }}

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEPLOY_ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_OUTPUT_PATH }}
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.github_environment || 'production' }}
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEPLOY_ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PACKAGE_PATH }}

      - name: Verify deployment variables
        shell: bash
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_FUNCTIONAPP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in this GitHub Environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.DEPLOY_PACKAGE_PATH }}
